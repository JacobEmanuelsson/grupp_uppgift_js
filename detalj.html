
<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details – Super Goods</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="detalj.css">

    <script src="detalj.js" defer></script>
    <script src="shared.js" defer></script>
</head>

<body>

    <header class="site-header">

        <div class="site-header-inner">

            <a class="site-brand" href="catalog.html"
               aria-label="Super Goods home">

                Super Goods
                <span>The place with everything</span>

            </a>

            <button
                class="mobile-menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="main-navigation">

                <span aria-hidden="true">&#9776;</span>

            </button>

            <nav id="main-navigation"
                 class="site-nav"
                 aria-label="Main navigation">

                <a href="catalog.html" aria-current="page">
                    Shop
                </a>

                <a href="favorites.html">
                    <span aria-hidden="true">♡</span>
                    <span>Favorites</span>
                </a>

                <a href="cart.html">
                    Bag
                </a>

            </nav>

        </div>

    </header>

    <main class="detail-main">

        <section class="catalog-hero detail-hero">

            <div class="hero-copy">

                <p class="eyebrow">PRODUCT COLLECTION</p>

                <h1>
                    Product <em>Details</em>
                </h1>

                <p class="hero-description">
                    Explore product information, check availability
                    and manage your selected product.
                </p>

            </div>

            <div class="hero-image-field" aria-hidden="true"></div>

        </section>

        <p
            id="loadingMessage"
            class="status-message"
            role="status"
            aria-live="polite"
            hidden>
        </p>

        <p
            id="errorMessage"
            class="error-message"
            role="alert">
        </p>

        <section
            id="productContainer"
            class="product-container"
            aria-label="Product information">
        </section>

    </main>

</body>
</html>
