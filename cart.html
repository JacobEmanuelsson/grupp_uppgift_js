<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your products - Super Goods</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <script src="shared.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a class="site-brand" href="catalog.html">
                Super Goods
                <span>The place with everything</span>
            </a>
            <button class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-navigation">&#9776;</button>
            <nav id="main-navigation" class="site-nav" aria-label="Main navigation">
                <a href="catalog.html">Shop</a>
                <a href="favorites.html"><span aria-hidden="true">♡</span> <span>Favorites</span></a>
                <a href="cart.html" class="is-current" aria-current="page">Bag</a>
            </nav>
        </div>
    </header>

    <main id="main" class="page-container">
        <h1>Your products</h1>
        <p id="cart-count" aria-live="polite"></p>
        <p id="cart-message" role="status" aria-live="polite" tabindex="-1" hidden></p>

        <div class="cart-layout">
            <section aria-label="Items in your bag">
                <ul id="cart-list"></ul>
                <a class="back-link" href="catalog.html">Continue shopping</a>
            </section>

            <aside id="cart-summary" aria-labelledby="summary-title">
                <h2 id="summary-title">Order summary</h2>
                <dl>
                    <div>
                        <dt>Subtotal</dt>
                        <dd id="subtotal"></dd>
                    </div>
                    <div>
                        <dt>Shipping</dt>
                        <dd id="shipping"></dd>
                    </div>
                    <div>
                        <dt>Total</dt>
                        <dd id="total"></dd>
                    </div>
                </dl>
                <a class="primary-button" href="checkout.html">Continue to checkout</a>
            </aside>
        </div>
    </main>

    <footer class="site-footer"><p>&copy; 2026 Super Goods AB</p></footer>

    <script src="cart-utils.js" defer></script>
    <script src="cart.js" defer></script>
</body>
</html>
